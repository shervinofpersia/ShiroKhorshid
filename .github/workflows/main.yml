name: Auto Akamai IP Scanner

on:
  schedule:
    # اجرا به صورت خودکار هر 1 ساعت یک‌بار
    - cron: '0 */1 * * *'
  workflow_dispatch: 
    # این گزینه اجازه می‌دهد هر زمان خواستید دکمه Run را دستی بزنید

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scanner Script
        run: python main.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Scanner"
          touch shir_khorshid_clean_ips.txt
          git add shir_khorshid_clean_ips.txt
          # اگر تغییر جدیدی نبود، اکشن ارور ندهد
          git commit -m "Auto-update clean IPs [skip ci]" || echo "No changes to commit"
          git push
